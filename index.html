<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>直播点歌单</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="songbook-shell">
      <section class="stage-panel" aria-labelledby="page-title">
        <div class="stage-copy">
          <p class="eyebrow">Live Songbook</p>
          <h1 id="page-title">直播点歌单</h1>
          <p class="intro">搜索歌名或歌手，筛选语种，点击复制点歌口令。</p>
        </div>

        <div class="now-pick" id="randomPick" aria-live="polite">
          <span class="now-label">随机推荐</span>
          <strong>还没有抽歌</strong>
          <span>从当前筛选结果里抽一首</span>
        </div>
      </section>

      <section class="toolbar" aria-label="歌单工具">
        <label class="search-box">
          <span>搜索</span>
          <input
            id="searchInput"
            type="search"
            placeholder="歌名 / 歌手 / 语种"
            autocomplete="off"
          />
        </label>

        <div class="action-row">
          <button class="primary-action" type="button" id="randomButton">随机点歌</button>
          <button class="ghost-action" type="button" id="clearButton">清空</button>
        </div>

        <div class="filter-group" id="languageFilters" aria-label="按语种筛选"></div>
      </section>

      <section class="status-grid" aria-label="歌单概览">
        <div class="metric">
          <span>总歌单</span>
          <strong id="totalCount">0</strong>
        </div>
        <div class="metric">
          <span>当前结果</span>
          <strong id="resultCount">0</strong>
        </div>
        <div class="metric">
          <span>语种</span>
          <strong id="languageCount">0</strong>
        </div>
      </section>

      <section class="list-panel" aria-label="歌曲列表">
        <div class="list-head">
          <div>
            <p class="eyebrow">Song List</p>
            <h2>可点歌曲</h2>
          </div>
          <p id="resultSummary">正在载入歌单...</p>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>歌名</th>
                <th>歌手</th>
                <th>语种</th>
                <th>类型</th>
              </tr>
            </thead>
            <tbody id="songRows"></tbody>
          </table>
        </div>

        <div class="card-list" id="songCards"></div>
        <div class="empty-state" id="emptyState" hidden>
          <strong>没有找到匹配歌曲</strong>
          <span>换个关键词或切回全部语种试试。</span>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="music-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
